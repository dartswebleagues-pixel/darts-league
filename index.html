<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Double Top Online Darts League</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#11249d;--gold:#f5c518;--red:#d20d19;--navy:#000099;--blue:#0a2cf0;--paper:#e9e9ee;--ink:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1d82}}
:root[data-theme=dark]{--bg:#0e1d82}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font:400 16px/1.3 Oswald,'Arial Narrow',sans-serif;min-height:100vh;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:110px;height:110px;background:repeating-linear-gradient(135deg,#fff 0 7px,transparent 7px 20px,#3b6cff 20px 28px,transparent 28px 40px);opacity:.9;pointer-events:none;z-index:0}
body::before{top:0;left:0;clip-path:polygon(0 0,100% 0,0 100%)}body::after{bottom:0;right:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
.tear{height:16px;background:var(--paper);clip-path:polygon(0 0,100% 0,100% 40%,96% 100%,90% 50%,83% 90%,75% 40%,66% 100%,58% 50%,49% 90%,40% 35%,31% 100%,22% 50%,13% 90%,6% 40%,0 100%);position:relative;z-index:1}
.wrap{max-width:880px;margin:auto;padding:10px 12px 40px;position:relative;z-index:1}
header{display:flex;align-items:center;gap:12px}header img{width:84px;height:auto}
header h1{font-size:clamp(17px,4.5vw,26px);margin:0;font-weight:500;line-height:1.1}header small{color:var(--gold);letter-spacing:1px}
nav,.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
button,select,input,textarea{font:inherit}
nav button,.pills button{background:transparent;color:#fff;border:2px solid #ffffff55;border-radius:6px;padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
nav button.on,.pills button.on{background:var(--gold);color:#000;border-color:var(--gold)}
.pills button{padding:4px 10px;font-size:14px}
h2{color:var(--gold);text-align:center;font-weight:500;font-size:clamp(28px,8vw,44px);margin:12px 0 0}
.sub{text-align:center;margin:2px 0;font-size:clamp(16px,4.4vw,24px)}.dl{text-align:center;font-size:clamp(13px,3.6vw,18px);margin:2px 0 12px}
.fx{display:grid;grid-template-columns:1fr 64px 1fr;margin:9px 0 0}
.fx b{background:#fff;color:#000;border:2px solid var(--red);text-align:center;padding:9px 4px;font-weight:500;font-size:clamp(15px,4.6vw,24px)}
.fx i{background:var(--red);font-style:normal;display:grid;place-items:center;font-weight:600}
.nt{color:var(--gold);font-size:14px;text-align:center;margin:2px 0}.fx b.rp{color:var(--blue)}.fx.rn{margin:2px 0 0}.fx.rn div{text-align:center;color:var(--gold);font-size:14px}
.foot{text-align:center;margin-top:16px;font-size:14px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px;text-align:center}
th{background:#fff;color:#000;font-weight:600;padding:3px 4px;white-space:nowrap}td{padding:3px 4px;font-weight:500}
td:nth-child(2),th:nth-child(2){text-align:left;padding-left:8px;white-space:nowrap}
tr.a td{background:var(--navy)}tr.b td{background:var(--blue)}tr.gd td{background:var(--gold);color:#000;font-weight:600}tr.r td{background:#f00}tr.l td{border-bottom:3px double #fff}
td small{opacity:.7;font-size:11px}
.rc{background:#0b1a7e;border:2px solid #ffffff33;border-radius:8px;margin:10px 0;padding:8px 10px}
.rc h4{margin:0 0 4px;font-weight:500;display:flex;justify-content:space-between;color:var(--gold)}
.g{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:3px 0;border-top:1px solid #ffffff22}
.g span:last-of-type{text-align:right}.g b{background:var(--red);padding:1px 10px;border-radius:4px}.g small{display:block;opacity:.75;font-size:12px;line-height:1.2}.g div{text-align:center}
.panel{background:#0b1a7e;border:2px solid #ffffff33;border-radius:8px;padding:12px;margin:10px 0}
.panel input,.panel select,.panel textarea{background:#fff;color:#000;border:0;border-radius:4px;padding:5px 7px;max-width:100%}
.panel label{display:inline-block;margin:4px 10px 4px 0;font-size:14px}.panel input[type=number]{width:64px}
.go{background:var(--gold);color:#000;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;margin:4px 6px 4px 0}.go.s{background:#fff;font-weight:500;padding:3px 9px;font-size:13px}
.c{text-align:center;opacity:.9}.warn{background:#3b2a00;border-left:4px solid var(--gold);padding:8px 10px;font-size:14px;margin:10px 0}
.chip{display:inline-block;border:2px solid #ffffff55;border-radius:6px;padding:3px 9px;margin:3px;cursor:pointer}.chip.on{background:var(--red);border-color:var(--red)}.chip.x{outline:2px solid var(--gold)}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:8px 0}.cal .h{text-align:center;font-size:13px;opacity:.8}.cal .d{min-height:52px;border-radius:4px;padding:3px 4px;font-size:15px;background:transparent;opacity:.25;border:2px solid transparent}.cal .d[data-a]{opacity:1;cursor:pointer}.cal .w1{background:#2446c9}.cal .w2{background:#162a9a}.cal .st{border-left:3px solid var(--gold)}.cal .on{background:var(--red);border-color:#fff}.cal small{display:block;font-size:10px;line-height:1.15;color:var(--gold)}.cal .on small{color:#fff}.cn{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.lg td,.lg th{font-size:14px}
.sl{display:flex;gap:8px;margin:10px 0}.sl select{min-width:0;background:#fff;color:#000;border:2px solid var(--red);border-radius:6px;padding:8px 6px;font-size:16px;font-weight:500}#dsel{flex:1.7}#wsel{flex:1}.pt{display:none}h3{color:var(--gold);font-weight:500;font-size:22px;text-align:center;margin:20px 0 6px}.gr{display:flex;gap:10px;flex-wrap:wrap}.gr>.panel:first-child{flex:3 1 340px}.gr>.up{flex:1 1 200px;align-self:flex-start}.up p{font-size:13px;margin:4px 0}.up input[type=file]{width:min(100%,360px);font-size:13px}.up div{font-size:13px;margin-top:6px}
.mr{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #ffffff22;padding:7px 0}.mr small{opacity:.85}.od{color:#ff8a8a;font-weight:600}a.go{display:inline-block;text-decoration:none}a.dc{display:inline-flex;align-items:center;justify-content:center;background:var(--bg);border:2px solid #ffffff55;border-radius:6px;padding:5px 14px;margin:4px 0 4px 6px;vertical-align:middle;text-decoration:none}a.dc img{height:24px;width:auto;display:block}.tt{color:var(--gold);font-size:22px;font-weight:600}.rc h4{align-items:center}.pu{padding:4px 0}.pu input[type=text],.pu input[type=file]{display:block;width:100%;background:#fff;color:#000;border:0;border-radius:4px;padding:8px;margin:6px 0;font-size:14px}.shot{max-width:100%;max-height:260px;border-radius:6px;margin:6px 6px 0 0}
.r2{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.r2 label{margin:0}.r2 select{width:150px}.r2 input[type=number]{width:58px}
.r2 label.mt{display:flex;gap:6px;align-items:center;flex:1 1 100%;order:3;min-width:0}.r2 .go.s{order:2;margin:0}.r2 select[data-s=rw]{width:64px}.mt select{flex:1;width:auto;min-width:0}
.pn{font-weight:500;margin:12px 0 2px}.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st3 label{display:block;margin:0;font-size:13px}.st3 input{display:block;width:100%!important}
.panel input,.panel select{min-height:40px}.panel textarea{width:100%}.fm label{display:block;margin:6px 0}.fm input,.fm select{width:100%;margin-top:2px}
.bar{position:sticky;bottom:0;z-index:5;padding:16px 0 8px;background:linear-gradient(transparent,var(--bg) 35%)}
@media (max-width:820px){nav,.pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}nav button,.pills button{flex:none}nav button{padding:6px 7px;font-size:14px;letter-spacing:0}}

@media (orientation:portrait) and (max-width:820px){.lt{min-width:0}.lt :is(th,td):is(:nth-child(6),:nth-child(7),:nth-child(8),:nth-child(11),:nth-child(12),:nth-child(13)){display:none}.lt th,.lt td{padding:6px 3px;font-size:17px}.lt td:nth-child(2),.lt th:nth-child(2){white-space:normal;padding-left:6px}.pt{display:inline}nav{gap:5px}nav button{padding:6px 8px;font-size:15px;letter-spacing:0}}.lg td:nth-child(2),.lg th:nth-child(2){text-align:left}
</style></head><body><div class="tear"></div><div class="wrap" id="app"></div>

 return`<div class='panel'><p>Screenshots from players are kept here as a record, and flagged results wait for you. At the end of the season you can delete every stored screenshot. The results stay.</p><b>${n} stored screenshot(s)</b><br>${U.del?`<button class='go' data-a='delimg'>Yes, delete all screenshots</button><button class='go s' data-a='delcancel'>Cancel</button>`:`<button class='go s' data-a='delask'>Delete all stored screenshots</button>`}</div>`+(S.asubs.length?S.asubs.map(card).join(''):`<p class='c'>No submissions yet.</p>`)};
const acctP=()=>{const lab={pending:'Waiting for approval',linked:'Linked',unlinked:'Unlinked',blocked:'Blocked'};
 return`<div class='panel'><p>Players sign up with their email, then pick their name. Approve each link here. Removing access takes effect straight away. Results and points stay with the player's place.</p></div>`+(S.accts.length?S.accts.map(a=>`<div class='panel'><b>${E(a.name||'?')}</b> · ${E(S.D[a.k]?S.D[a.k].t:a.k)}<br><small>${E(a.email)} · ${lab[a.status]||a.status}</small><div>${a.status!='linked'&&a.status!='blocked'?`<button class='go' data-a='acc' data-op='approve' data-e='${E(a.email)}'>Approve</button>`:''}${a.status=='linked'?`<button class='go s' data-a='acc' data-op='unlink' data-e='${E(a.email)}'>Remove access</button>`:''}${a.status!='blocked'?`<button class='go s' data-a='acc' data-op='block' data-e='${E(a.email)}'>Block</button>`:`<button class='go s' data-a='acc' data-op='unblock' data-e='${E(a.email)}'>Unblock</button>`}</div></div>`).join(''):`<p class='c'>No accounts yet.</p>`)};
const authV=()=>{const up=U.am=='up';return`<h2>${up?'Create account':'Sign in'}</h2><div class='panel fm'><p>${up?'Sign up with your email address and choose a password. You then pick your name and the admin approves it.':'Sign in to see your fixtures, upload results and set your availability.'}</p><label>Email<input type='email' id='ae' autocomplete='email' value='${E(U.em||'')}'></label><label>Password<input type='password' id='ap' autocomplete='${up?'new-password':'current-password'}'></label>${up?`<label>Repeat password<input type='password' id='ap2' autocomplete='new-password'></label>`:''}${U.msg?`<div class='nt' style='text-align:left'>${E(U.msg)}</div>`:''}<button class='go' data-a='${up?'signup':'signin'}'>${up?'Create account':'Sign in'}</button>${up?'':`<button class='go s' data-a='reset'>Forgot password?</button>`}<div class='c' style='margin-top:8px'><button class='go s' data-a='am' data-v='${up?'in':'up'}'>${up?'I already have an account':'New here? Create an account'}</button></div></div><div class='c'>${DCA}</div>`};
function shuf(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function rr(p){const n=p.length,fx=[],a=[...Array(n).keys()];for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){let h=a[i],b=a[n-1-i];if(r%2)[h,b]=[b,h];fx.push([r+1,i+1,h,b,0,''])}a.splice(1,0,a.pop())}return fx}

function vAd(){const k=U.k,d=S.D[k],ps=d.n.map((n,i)=>[n,i]).filter(x=>x[0]!='Free Week');
 const sub=`<div class="pills">${[['res','Enter results'],['miss','Missing results'],['sub','Submissions'+(S.asubs.filter(x=>x.st=='flagged').length?' ('+S.asubs.filter(x=>x.st=='flagged').length+')':'')],['acc','Accounts'+(S.accts.filter(x=>x.status=='pending').length?' ('+S.accts.filter(x=>x.status=='pending').length+')':'')],['rel','Releases'],['rep','Replace player'],['drw','Draw fixtures'],['log','Admin log']].map(([a,b])=>`<button data-a="adm" data-v="${a}" class="${U.adm==a?'on':''}">${b}</button>`).join('')}</div>`;let b='';
 if(U.adm=='res'){const wk=Array.from({length:maxW(k)},(_,i)=>i+1),fs=d.fx.filter(f=>f[0]==U.rw).sort((a,b)=>a[1]-b[1]);if(!fs.find(f=>f[1]==U.rm))U.rm=fs[0][1];const f=fs.find(f=>f[1]==U.rm);
  const game=g=>{const h=g==1?f[2]:f[3],a=g==1?f[3]:f[2],r=gr(k,U.rw,U.rm,g),fw=d.n[h]=='Free Week'||d.n[a]=='Free Week',n=(x,i)=>`<input type="number" step="any" min="0" id="${x}" value="${r&&!r[13]?r[i]||'':''}">`;
   return`<div class="panel"><b>Game ${g}: ${E(d.n[h])} v ${E(d.n[a])}</b><br>${fw?'Free Week: the real player is given a 4-2 bye win.':`<div class='r2'><label>Status <select id="st${g}"><option value="n" ${r?'':'selected'}>Not played</option><option value="p" ${r&&!r[13]?'selected':''}>Played</option><option value="h" ${r&&r[13]&&r[5]<r[6]?'selected':''}>${E(d.n[h])} forfeits</option><option value="a" ${r&&r[13]&&r[5]>r[6]?'selected':''}>${E(d.n[a])} forfeits</option></select></label><label>Legs <input type="number" min="0" max="4" id="hl${g}" value="${r?r[5]:''}"> - <input type="number" min="0" max="4" id="al${g}" value="${r?r[6]:''}"></label></div><div class='pn'>${E(d.n[h])}</div><div class='st3'><label>Avg ${n('havg'+g,8)}</label><label>Checkout ${n('hco'+g,7)}</label><label>180s ${n('h8'+g,9)}</label></div><div class='pn'>${E(d.n[a])}</div><div class='st3'><label>Avg ${n('aavg'+g,11)}</label><label>Checkout ${n('aco'+g,10)}</label><label>180s ${n('a8'+g,12)}</label></div>`}${fw?`<select id="st${g}" hidden><option value="p">p</option></select>`:''}${fw?'':up(g)}</div>`};
  b=`<div class="panel r2"><label>Week <select data-s="rw">${wk.map(w=>`<option ${w==U.rw?'selected':''}>${w}</option>`).join('')}</select></label><label class='mt'>Match <select data-s="rm">${fs.map(x=>`<option value="${x[1]}" ${x[1]==U.rm?'selected':''}>${E(d.n[x[2]])} v ${E(d.n[x[3]])}</option>`).join('')}</select></label>
  <button class="go s" data-a="pp">${f[4]?'Remove':'Mark'} P:P</button></div>${game(1)}${game(2)}<div class='bar'><button class="go" data-a="sv">Save match</button><button class="go s" data-a="clr">Clear results</button></div>`}
 if(U.adm=='rel'){b=`<div class="panel"><p>Weeks release automatically at 00:00 on their start date. Override any week below.</p><div class='tw'><table class="lg"><tr><th>Week</th><th>Starts</th><th>Status</th><th></th></tr>${Array.from({length:maxW(k)},(_,i)=>i+1).map(w=>{const o=S.rel[k+':'+w];return`<tr><td>${w}</td><td>${sd(w)}</td><td>${rel(k,w)?'Visible':'Hidden'}${o===1?' (early)':o===-1?' (held)':''}</td><td><button class="go s" data-a="rel" data-w="${w}" data-v="1">Release now</button><button class="go s" data-a="rel" data-w="${w}" data-v="-1">Hold</button><button class="go s" data-a="rel" data-w="${w}" data-v="auto">Auto</button></td></tr>`}).join('')}</table></div></div>`}
 const ul=(()=>{const n=S.log.findIndex(l=>l.type=='Replace'&&l.div==k&&!l.u&&d.n.includes(l.neu));return n<0?'':`<p>Last replacement: ${E(S.log[n].old)} → ${E(S.log[n].neu)} (${E(S.log[n].t)}) <button class="go s" data-a="undo" data-i="${n}">Undo</button></p>`})();
 if(U.adm=='rep')b=`<div class="panel fm"><p>The new player takes the same table place and keeps played, won, lost, legs and points. Their average, highest checkout and 180s start from zero. Earlier results stay under the old name.</p><label>Outgoing <select id="ro">${ps.map(([n,i])=>`<option value="${i}">${E(n)}</option>`).join('')}</select></label><label>New player <input id="rn"></label><label>Reason <input id="rw"></label><br><button class="go" data-a="rep">Replace player</button>${ul}</div>`;
 if(U.adm=='drw')b=`<div class="panel"><p>Randomly draws the players into a full round robin: every player meets every other player home and away, one opponent each week.</p><textarea id="pl" rows="8" cols="28">${E(ps.map(x=>x[0]).join('\n'))}</textarea><br><button class="go" data-a="draw">Draw fixtures</button>${U.draw?`<button class="go" data-a="apply">Use this draw (clears ${k} results)</button>`:''}</div>${U.draw?`<div class="panel">${Array.from({length:U.draw.p.length-1},(_,w)=>`<div><b>Week ${w+1}:</b> ${U.draw.fx.filter(f=>f[0]==w+1).map(f=>E(U.draw.p[f[2]])+' v '+E(U.draw.p[f[3]])).join(' · ')}</div>`).join('')}</div>`:''}`;
 if(U.adm=='miss')b=missP();
 if(U.adm=='sub')b=subP();
 if(U.adm=='acc')b=acctP();
 if(U.adm=='log')b=`<div class="panel"><div class="tw"><table class="lg"><tr><th>When</th><th>Division</th><th>Action</th><th>Detail</th><th></th></tr>${S.log.map((l,n)=>`<tr><td>${E(l.t)}</td><td>${E(l.div)}</td><td>${l.type}</td><td>${l.type=='Replace'?`${E(l.old)} → ${E(l.neu)}${l.why?' ('+E(l.why)+')':''}; avg, CO and 180s reset${l.u?' – undone '+E(l.u):''}`:l.type=='Undo'?`${E(l.neu)} restored in place of ${E(l.old)}; results entered under ${E(l.old)} renamed back`:E(l.why)}</td><td>${l.type=='Replace'&&!l.u&&S.D[l.div].n.indexOf(l.neu)>=0?`<button class="go s" data-a="undo" data-i="${n}">Undo</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5>Nothing logged yet.</td></tr>'}</table></div></div>`;
 return (U.adm=='miss'?'':divPills())+sub+b}

function R(){const T=[['home','Home'],['fx','Fixtures'],['tb','Tables'],['rs','Results'],['av','Availability']];if(adm())T.push(['ad','Admin']);
 if(U.tab=='ad'&&!adm())U.tab='fx';
 $('#app').innerHTML=`<header><img src="data:image/webp;base64,${LOGO}" alt="Double Top Online Darts League"><div><h1>Double Top Online Darts League</h1><small>SEASON 9</small></div>${U.user?`<button class='go s' data-a='signout' style='margin-left:auto'>Sign out</button>`:''}</header><nav>${T.map(([a,b])=>`<button data-a="tab" data-v="${a}" class="${U.tab==a?'on':''}">${b}</button>`).join('')}${U.isAdm?`<button data-a="prev">${U.prev?'Back to admin':'View as player'}</button>`:''}</nav>`+(U.loading?"<p class='c'>Loading…</p>":U.err?`<div class='warn'>${E(U.err)}</div>`:{home:vHome,fx:vFx,tb:vTb,rs:vRs,av:vCal,ad:vAd}[U.tab]())}
const $=s=>document.querySelector(s);
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset)});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='dsel')A.div({v:t.value});else if(t.id=='wsel')A.wk({v:t.value});else if(t.id=='hk'){U.hk=t.value;R()}});
document.addEventListener('change',async e=>{const t=e.target,m=/^pf(\d+)_(\d+)_(\d)$/.exec(t.id||'');if(!m||!t.files.length||!U.me)return;
 const w=+m[1],mm=+m[2],g=+m[3],k=U.me.k,box=document.getElementById('pm'+m[1]+'_'+m[2]+'_'+m[3]),fl=[...t.files];box.textContent='Reading your screenshot… you may be asked to allow Claude first.';
 const r=await readGame(fl,k,w,mm,g);r.k=k;r.w=w;r.m=mm;r.g=g;r.imgs=[];U.pv=r;R()});
document.addEventListener('input',e=>{const m=/^(hl|al|havg|hco|h8|aavg|aco|a8)([12])$/.exec(e.target.id||''),s=m&&document.getElementById('st'+m[2]);if(s&&s.value=='n')s.value='p'});
document.addEventListener('change',e=>{const t=e.target,m=/^st([12])$/.exec(t.id||'');if(!m)return;const h=document.getElementById('hl'+m[1]),a=document.getElementById('al'+m[1]);if(!h||!a)return;
 if(t.value=='h'||t.value=='a'){h.value=t.value=='h'?2:4;a.value=t.value=='h'?4:2;h.dataset.auto=a.dataset.auto=1}else if(h.dataset.auto){h.value=a.value='';delete h.dataset.auto;delete a.dataset.auto}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-s]');if(!t)return;const k=t.dataset.s;U[k]=+t.value;if(k=='rw')U.rm=1;R()});
R();
load().catch(e=>{U.loading=false;U.err='Could not reach the league server. '+e.message;R()});
</script></body></html>
